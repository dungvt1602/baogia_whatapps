services:
  # ---- Frontend Next.js (proxy /api/* sang backend NestJS) ----
  app:
    build:
      context: .
      target: runner
    image: ago-baogia
    environment:
      # URL backend NestJS (đích proxy phía server, đọc lúc chạy)
      BACKEND_URL: ${BACKEND_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    restart: unless-stopped
